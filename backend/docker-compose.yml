services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Database is not exposed to the host or public internet.
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_SSL_ENABLED: ${DB_SSL_ENABLED:-false}
      ENVIRONMENT: production
      DATABASE_URL: postgresql+pg8000://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DB_SSL_ENABLED: ${DB_SSL_ENABLED:-false}
      ENVIRONMENT: production
      DATABASE_URL: postgresql+pg8000://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v4}
      SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b}
      SARVAM_TIMEOUT_SECONDS: ${SARVAM_TIMEOUT_SECONDS:-30}
      SARVAM_UPLOAD_IDLE_TIMEOUT_SECONDS: ${SARVAM_UPLOAD_IDLE_TIMEOUT_SECONDS:-10}
      SARVAM_UPLOAD_MAX_DURATION_SECONDS: ${SARVAM_UPLOAD_MAX_DURATION_SECONDS:-120}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  db_data:
